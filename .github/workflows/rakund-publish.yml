name: Publish Rakund

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ======================================================
  # Build
  # ======================================================

  build:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false

      matrix:
        include:
          # Linux x86_64
          - name: Linux x86_64
            os: ubuntu-22.04

          # Windows x86_64
          - name: Windows x86_64
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Linux dependencies
      # --------------------------------------------------

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libudev-dev

      # --------------------------------------------------
      # Bun
      # --------------------------------------------------

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # --------------------------------------------------
      # Rust
      # --------------------------------------------------

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # --------------------------------------------------
      # Rust cache
      # --------------------------------------------------

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      # --------------------------------------------------
      # Frontend dependencies
      # --------------------------------------------------

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # --------------------------------------------------
      # Build Tauri
      # --------------------------------------------------

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v1

      # --------------------------------------------------
      # Upload bundle as GitHub Actions artifact
      # --------------------------------------------------

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: rakund-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  # ======================================================
  # Create GitHub Release
  # ======================================================

  release:
    name: Create GitHub Release

    needs: build

    runs-on: ubuntu-22.04

    steps:
      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Download Linux bundle
      # --------------------------------------------------

      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: rakund-ubuntu-22.04
          path: release/linux

      # --------------------------------------------------
      # Download Windows bundle
      # --------------------------------------------------

      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: rakund-windows-latest
          path: release/windows

      # --------------------------------------------------
      # Show generated files
      # --------------------------------------------------

      - name: List release files
        run: |
          echo "Generated bundles:"
          find release -type f -print

      # --------------------------------------------------
      # Create GitHub Release
      # --------------------------------------------------

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Rakund ${{ github.ref_name }}" \
            --generate-notes \
            --draft

      # --------------------------------------------------
      # Upload Linux packages
      # --------------------------------------------------

      - name: Upload Linux packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find release/linux -type f \
            \( \
              -name "*.deb" \
              -o -name "*.AppImage" \
              -o -name "*.AppImage.tar.gz" \
              -o -name "*.sig" \
            \) \
            -exec gh release upload \
              "${{ github.ref_name }}" \
              {} \
              --clobber \;

      # --------------------------------------------------
      # Upload Windows packages
      # --------------------------------------------------

      - name: Upload Windows packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find release/windows -type f \
            \( \
              -name "*.exe" \
              -o -name "*.msi" \
              -o -name "*.nsis.zip" \
              -o -name "*.msi.zip" \
              -o -name "*.sig" \
            \) \
            -exec gh release upload \
              "${{ github.ref_name }}" \
              {} \
              --clobber \;
